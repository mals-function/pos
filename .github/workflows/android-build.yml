# .github/workflows/android-build.yml
name: Android CI - Build & Package APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK 17) with built-in Gradle caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Accept Android SDK Licenses (uses pre-installed Android SDK on GitHub runner)
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # Step 4: Set up Node.js runtime (Capacitor 8 requires Node.js >= 22)
      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Step 5: Install dependencies
      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      # Step 6: Build Ionic React web assets
      - name: Build Web Application
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      # Step 7: Synchronize Capacitor with Android native layer
      - name: Sync Capacitor to Android
        run: npx cap sync android

      # Step 8: Make Gradle wrapper executable
      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./android/gradlew

      # Step 9: Build Android Debug APK
      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../5M-SariSariStore-POS.apk

      # Step 10: Locate and Upload the generated APK as a downloadable Artifact
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 5M-SariSariStore-POS-APK
          path: 5M-SariSariStore-POS.apk
          retention-days: 14