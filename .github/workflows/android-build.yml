# .github/workflows/android-build.yml
name: Android CI - Build & Package APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK 17) required for Android Gradle Plugin
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Step 4: Set up Node.js runtime
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 5: Install dependencies
      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      # Step 6: Build Ionic React web assets
      - name: Build Web Application
        run: npm run build

      # Step 7: Synchronize Capacitor with Android native layer
      - name: Sync Capacitor to Android
        run: npx cap sync android

      # Step 8: Cache Gradle dependencies to accelerate future runs
      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 9: Make Gradle wrapper executable
      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./android/gradlew

      # Step 10: Build Android Debug APK
      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../5M-SariSariStore-POS.apk

      # Step 11: Locate and Upload the generated APK as a downloadable Artifact
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 5M-SariSariStore-POS-APK
          path: 5M-SariSariStore-POS.apk
          retention-days: 14